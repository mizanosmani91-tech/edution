name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # composer.json এ নতুন প্যাকেজ যোগ হলেও composer.lock এখানে (GitHub-এর
      # PHP/composer থাকা runner-এ) নিয়মিত আপডেট হয়ে যায়, VPS-এ PHP/composer
      # লাগে না — শুধু lock ফাইল রিজেনারেট করা হচ্ছে, প্যাকেজ ইনস্টল না
      # (--no-install দ্রুততার জন্য)।
      - name: Sync composer.lock with composer.json
        run: composer update --lock --no-install --no-interaction

      - name: Commit composer.lock if it changed
        id: check
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "chore: sync composer.lock [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-lock
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/edution-laravel
            git pull origin main
            composer install --no-dev --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
